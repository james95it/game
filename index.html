<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Tổng Hợp Game</title>
    <!-- Sử dụng Tailwind CSS để giao diện đẹp và hiện đại nhanh chóng -->
    <script src="https://tailwindcss.com"></script>
    <!-- Font chữ Google Font -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

    <!-- Thanh điều hướng / Header -->
    <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <h1 class="text-2xl font-bold text-indigo-400 tracking-wide">🎮 KHO GAME CỦA TÔI</h1>
            
            <!-- Thanh tìm kiếm -->
            <div class="relative w-full sm:w-72">
                <input type="text" id="searchBar" onkeyup="filterGames()" placeholder="Tìm tên game..." 
                       class="w-full bg-gray-700 text-sm text-white placeholder-gray-400 rounded-lg pl-10 pr-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-gray-600">
                <span class="absolute left-3 top-2.5 text-gray-400">🔍</span>
            </div>
        </div>
    </header>

    <!-- Khu vực Bộ lọc Thể loại -->
    <main class="max-w-6xl mx-auto px-4 py-8">
        <div class="flex flex-wrap gap-2 mb-8" id="filterContainer">
            <button onclick="filterCategory('all')" class="category-btn bg-indigo-600 text-white px-4 py-1.5 rounded-full text-sm font-medium hover:bg-indigo-500 transition">Tất cả</button>
            <button onclick="filterCategory('hanh-dong')" class="category-btn bg-gray-800 text-gray-300 px-4 py-1.5 rounded-full text-sm font-medium hover:bg-gray-700 transition">Hành động</button>
            <button onclick="filterCategory('tri-tue')" class="category-btn bg-gray-800 text-gray-300 px-4 py-1.5 rounded-full text-sm font-medium hover:bg-gray-700 transition">Trí tuệ</button>
            <button onclick="filterCategory('nhap-vai')" class="category-btn bg-gray-800 text-gray-300 px-4 py-1.5 rounded-full text-sm font-medium hover:bg-gray-700 transition">Nhập vai</button>
            <button onclick="filterCategory('chien-thuat')" class="category-btn bg-gray-800 text-gray-300 px-4 py-1.5 rounded-full text-sm font-medium hover:bg-gray-700 transition">Chiến thuật</button>
        </div>

        <!-- Danh sách Game (Grid Layout) -->
        <!-- Bạn sẽ thêm, sửa hoặc xóa các game ở khu vực này -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="gameGrid">
            
            <!-- GAME 1 -->
            <div class="game-card bg-gray-800 rounded-xl overflow-hidden shadow-lg border border-gray-700 hover:border-indigo-500 transition-all duration-300 transform hover:-translate-y-1" data-category="hanh-dong">
                <img src="https://unsplash.com" alt="Thumbnail Game" class="w-full h-40 object-cover">
                <div class="p-4">
                    <span class="text-xs font-semibold bg-red-500/20 text-red-400 px-2 py-0.5 rounded">Hành động</span>
                    <h3 class="game-title text-lg font-bold mt-2 text-white">Pokemon Firered Cloud Save</h3>
                    <p class="text-gray-400 text-xs mt-1 line-clamp-2">Chơi Pokemon nhưng cloud save.</p>
                    <a href="https://james95it.github.io/pkmcloudsave/" target="_blank" class="block text-center bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm py-2 px-4 rounded-lg mt-4 transition">
                        Chơi ngay 🚀
                    </a>
                </div>
            </div>

            <!-- GAME 2 -->
            <div class="game-card bg-gray-800 rounded-xl overflow-hidden shadow-lg border border-gray-700 hover:border-indigo-500 transition-all duration-300 transform hover:-translate-y-1" data-category="tri-tue">
                <img src="https://unsplash.com" alt="Thumbnail Game" class="w-full h-40 object-cover">
                <div class="p-4">
                    <span class="text-xs font-semibold bg-green-500/20 text-green-400 px-2 py-0.5 rounded">Trí tuệ</span>
                    <h3 class="game-title text-lg font-bold mt-2 text-white">Snake 2</h3>
                    <p class="text-gray-400 text-xs mt-1 line-clamp-2">Siêu rắn săn mồi pro vip plus max </p>
                    <a href="https://james95it.github.io/snake2" target="_blank" class="block text-center bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm py-2 px-4 rounded-lg mt-4 transition">
                        Chơi ngay 🚀
                    </a>
                </div>
            </div>

            <!-- GAME 3 -->
            <div class="game-card bg-gray-800 rounded-xl overflow-hidden shadow-lg border border-gray-700 hover:border-indigo-500 transition-all duration-300 transform hover:-translate-y-1" data-category="chien-thuat">
                <img src="https://unsplash.com" alt="Thumbnail Game" class="w-full h-40 object-cover">
                <div class="p-4">
                    <span class="text-xs font-semibold bg-yellow-500/20 text-yellow-400 px-2 py-0.5 rounded">Chiến thuật</span>
                    <h3 class="game-title text-lg font-bold mt-2 text-white">Tên Game Chiến Thuật 3</h3>
                    <p class="text-gray-400 text-xs mt-1 line-clamp-2">Xây dựng quân đội và bày binh bố trận để giành chiến thắng vinh quang.</p>
                    <a href="THAY_LINK_GAME_CỦA_BẠN_VÀO_ĐÂY" target="_blank" class="block text-center bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm py-2 px-4 rounded-lg mt-4 transition">
                        Chơi ngay 🚀
                    </a>
                </div>
            </div>

            <!-- Bạn có thể copy đoạn code từ "<div class="game-card..." đến "</div>" ở trên để tạo thêm Game số 4, 5, 6... -->

        </div>
    </main>

    <!-- Logic Xử lý Tìm kiếm và Bộ lọc -->
    <script>
        // Hàm tìm kiếm game theo tên
        function filterGames() {
            const input = document.getElementById('searchBar').value.toLowerCase();
            const cards = document.getElementsByClassName('game-card');

            for (let i = 0; i < cards.length; i++) {
                const title = cards[i].querySelector('.game-title').innerText.toLowerCase();
                if (title.includes(input)) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }

        // Hàm lọc game theo thể loại (Category)
        function filterCategory(category) {
            const cards = document.getElementsByClassName('game-card');
            const buttons = document.getElementsByClassName('category-btn');

            // Đổi màu nút được chọn để người dùng dễ nhận biết
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].classList.replace('bg-indigo-600', 'bg-gray-800');
                buttons[i].classList.replace('text-white', 'text-gray-300');
            }
            event.target.classList.replace('bg-gray-800', 'bg-indigo-600');
            event.target.classList.replace('text-gray-300', 'text-white');

            // Ẩn/Hiện game theo danh mục tương ứng
            for (let i = 0; i < cards.length; i++) {
                const gameCat = cards[i].getAttribute('data-category');
                if (category === 'all' || gameCat === category) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>

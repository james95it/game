<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Tổng Hợp Game</title>
    <!-- Sử dụng Tailwind CSS để giao diện đẹp và hiện đại nhanh chóng -->
    <script src="https://tailwindcss.com"></script>
    <!-- Font chữ Google Font -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* CSS Nội bộ - Đảm bảo giao diện luôn hiển thị kể cả khi offline */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #111827; color: #f3f4f6; min-height: 100vh; padding-bottom: 40px; }
        
        /* Header & Tìm kiếm */
        header { background-color: #1f2937; border-bottom: 1px solid #374151; position: sticky; top: 0; z-index: 50; }
        .header-container { max-width: 1100px; margin: 0 auto; padding: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        h1 { color: #818cf8; font-size: 24px; font-weight: 700; letter-spacing: 1px; }
        .search-box { position: relative; width: 100%; max-width: 280px; }
        .search-box input { width: 100%; background-color: #374151; border: 1px solid #4b5563; color: white; border-radius: 8px; padding: 8px 12px 8px 35px; font-size: 14px; outline: none; }
        .search-box input:focus { border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }
        .search-box::before { content: "🔍"; position: absolute; left: 10px; top: 8px; font-size: 14px; }

        /* Bộ lọc danh mục */
        main { max-width: 1100px; margin: 0 auto; padding: 20px 15px; }
        .filter-container { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; }
        .category-btn { background-color: #1f2937; color: #d1d5db; border: none; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .category-btn:hover { background-color: #374151; }
        .category-btn.active { background-color: #4f46e5; color: white; }

        /* Lưới hiển thị danh sách game */
        .game-grid { display: grid; grid-template-cols: 1fr; gap: 24px; }
        @media (min-width: 576px) { .game-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 768px) { .game-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 1024px) { .game-grid { grid-template-columns: repeat(4, 1fr); } }

        /* Thẻ Game (Card) */
        .game-card { background-color: #1f2937; border-radius: 12px; overflow: hidden; border: 1px solid #374151; display: flex; flex-direction: column; transition: transform 0.3s, border-color: 0.3s; }
        .game-card:hover { transform: translateY(-5px); border-color: #6366f1; }
        .game-img { 
    width: 80px;          /* Cố định chiều rộng của icon */
    height: 80px;         /* Cố định chiều cao của icon */
    object-fit: contain;  /* Giữ nguyên tỷ lệ icon, không bị bóp méo hay cắt mất hình */
    display: block;
    margin: 20px auto 10px auto; /* Căn giữa icon và tạo khoảng cách trên dưới */
    border-radius: 16px;  /* Bo tròn 4 góc của icon cho giống giao diện App Store/Google Play */
    background-color: #2d3748; /* Tạo một lớp nền tối nhẹ phía sau icon */
    padding: 8px;         /* Tạo khoảng cách giữa hình icon và viền nền */
}

        .game-info { padding: 16px; display: flex; flex-direction: column; flex-grow: 1; }
        .badge { display: inline-block; align-self: flex-start; font-size: 11px; font-weight: 600; padding: 2px 8px; rounded-radius: 4px; border-radius: 4px; text-transform: uppercase; }
        .badge.action { background-color: rgba(239, 68, 68, 0.2); color: #f87171; }
        .badge.puzzle { background-color: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .badge.strategy { background-color: rgba(234, 179, 8, 0.2); color: #facc15; }
        .game-title { font-size: 18px; font-weight: 700; margin: 10px 0 6px 0; color: white; }
        .game-desc { color: #9ca3af; font-size: 13px; line-height: 1.4; margin-bottom: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex-grow: 1; }
        .play-btn { display: block; text-align: center; background-color: #4f46e5; color: white; text-decoration: none; font-weight: 600; font-size: 14px; padding: 10px; border-radius: 8px; transition: background-color 0.2s; }
        .play-btn:hover { background-color: #4338ca; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

    <!-- Thanh điều hướng / Header -->
    <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <h1 class="text-2xl font-bold text-indigo-400 tracking-wide">🎮 KHO GAME CỦA TÔI</h1>
            
            <!-- Thanh tìm kiếm -->
            <div class="relative w-full sm:w-72">
                <input type="text" id="searchBar" onkeyup="filterGames()" placeholder="Tìm tên game..." 
                       class="w-full bg-gray-700 text-sm text-white placeholder-gray-400 rounded-lg pl-10 pr-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-gray-600">
                <span class="absolute left-3 top-2.5 text-gray-400">🔍</span>
            </div>
        </div>
    </header>

    <!-- Khu vực Bộ lọc Thể loại -->
    <main class="max-w-6xl mx-auto px-4 py-8">
        <div class="flex flex-wrap gap-2 mb-8" id="filterContainer">
            <button onclick="filterCategory('all')" class="category-btn bg-indigo-600 text-white px-4 py-1.5 rounded-full text-sm font-medium hover:bg-indigo-500 transition">Tất cả</button>
            <button onclick="filterCategory('hanh-dong')" class="category-btn bg-gray-800 text-gray-300 px-4 py-1.5 rounded-full text-sm font-medium hover:bg-gray-700 transition">Hành động</button>
            <button onclick="filterCategory('tri-tue')" class="category-btn bg-gray-800 text-gray-300 px-4 py-1.5 rounded-full text-sm font-medium hover:bg-gray-700 transition">Trí tuệ</button>
            <button onclick="filterCategory('nhap-vai')" class="category-btn bg-gray-800 text-gray-300 px-4 py-1.5 rounded-full text-sm font-medium hover:bg-gray-700 transition">Nhập vai</button>
            <button onclick="filterCategory('chien-thuat')" class="category-btn bg-gray-800 text-gray-300 px-4 py-1.5 rounded-full text-sm font-medium hover:bg-gray-700 transition">Chiến thuật</button>
        </div>

        <!-- Danh sách Game (Grid Layout) -->
        <!-- Bạn sẽ thêm, sửa hoặc xóa các game ở khu vực này -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="gameGrid">
            
            <!-- GAME 1 -->
            <div class="game-card" data-category="nhap-vai">
    <!-- Nếu bạn up ảnh lên cùng thư mục với file index.html trên GitHub, chỉ cần điền tên file ảnh -->
    <img src="pokeball.png" alt="Thumbnail Game" class="game-img">
    <div class="game-info">
        <span class="badge puzzle">Nhập Vai</span>
        <h3 class="game-title">Pokemon Fire Red Cloud Save</h3>
        <p class="game-desc">Pokemon Fire Red nhưng chơi bằng Cloud Save</p>
        <a href="https://james95it.github.io/pkmcloudsave/" target="_blank" class="play-btn">Chơi ngay 🚀</a>
    </div>
</div>

            <!-- GAME 2 -->
            <div class="game-card" data-category="hanh-dong">
    <!-- Nếu bạn up ảnh lên cùng thư mục với file index.html trên GitHub, chỉ cần điền tên file ảnh -->
    <img src="snake.png" alt="Thumbnail Game" class="game-img">
    <div class="game-info">
        <span class="badge puzzle">Hành Động</span>
        <h3 class="game-title">Snake 2</h3>
        <p class="game-desc">Snake version vip pro max premium plus ultra</p>
        <a href="https://james95it.github.io/snake2/" target="_blank" class="play-btn">Chơi ngay 🚀</a>
    </div>
</div>

            <!-- Bạn có thể copy đoạn code từ "<div class="game-card..." đến "</div>" ở trên để tạo thêm Game số 4, 5, 6... -->
 <!-- GAME 3 -->
            <div class="game-card" data-category="tri-tue">
    <!-- Nếu bạn up ảnh lên cùng thư mục với file index.html trên GitHub, chỉ cần điền tên file ảnh -->
    <img src="line.png" alt="Thumbnail Game" class="game-img">
    <div class="game-info">
        <span class="badge puzzle">Trí tuệ</span>
        <h3 class="game-title">Line</h3>
        <p class="game-desc">Game siêu trí tuệ </p>
        <a href="https://james95it.github.io/line/" target="_blank" class="play-btn">Chơi ngay 🚀</a>
    </div>
</div>
        </div>
    </main>

    <!-- Logic Xử lý Tìm kiếm và Bộ lọc -->
    <script>
        // Hàm tìm kiếm game theo tên
        function filterGames() {
            const input = document.getElementById('searchBar').value.toLowerCase();
            const cards = document.getElementsByClassName('game-card');

            for (let i = 0; i < cards.length; i++) {
                const title = cards[i].querySelector('.game-title').innerText.toLowerCase();
                if (title.includes(input)) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }

        // Hàm lọc game theo thể loại (Category)
        function filterCategory(category) {
            const cards = document.getElementsByClassName('game-card');
            const buttons = document.getElementsByClassName('category-btn');

            // Đổi màu nút được chọn để người dùng dễ nhận biết
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].classList.replace('bg-indigo-600', 'bg-gray-800');
                buttons[i].classList.replace('text-white', 'text-gray-300');
            }
            event.target.classList.replace('bg-gray-800', 'bg-indigo-600');
            event.target.classList.replace('text-gray-300', 'text-white');

            // Ẩn/Hiện game theo danh mục tương ứng
            for (let i = 0; i < cards.length; i++) {
                const gameCat = cards[i].getAttribute('data-category');
                if (category === 'all' || gameCat === category) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
